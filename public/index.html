<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MultiDesk</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand">MultiDesk</h1>
      <label class="tenant-picker">
        <span>Client</span>
        <select id="tenant-select" data-testid="tenant-select" aria-label="Client"></select>
      </label>
    </header>

    <main class="layout">
      <section class="panel" aria-labelledby="new-ticket-heading">
        <h2 id="new-ticket-heading">New ticket</h2>
        <form id="ticket-form" data-testid="ticket-form" novalidate>
          <label>
            Title
            <input name="title" data-testid="ticket-title" required minlength="3" maxlength="120" autocomplete="off" />
          </label>
          <label>
            Customer name
            <input name="customer_name" data-testid="ticket-customer" required minlength="2" maxlength="80" autocomplete="off" />
          </label>
          <label>
            Priority
            <select name="priority" data-testid="ticket-priority">
              <option value="low">Low</option>
              <option value="normal" selected>Normal</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </label>
          <button type="submit" data-testid="ticket-submit">Create ticket</button>
        </form>
        <p id="message" class="message" role="status" aria-live="polite" data-testid="message"></p>
      </section>

      <section class="panel" aria-labelledby="tickets-heading">
        <div class="list-header">
          <h2 id="tickets-heading">Tickets</h2>
          <select id="status-filter" data-testid="status-filter" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option value="open">Open</option>
            <option value="in_progress">In progress</option>
            <option value="resolved">Resolved</option>
          </select>
        </div>
        <ul id="ticket-list" class="ticket-list" data-testid="ticket-list"></ul>
      </section>
    </main>

    <template id="ticket-template">
      <li class="ticket" data-testid="ticket-item">
        <div class="ticket-head">
          <span class="ticket-id" data-testid="ticket-id"></span>
          <span class="badge" data-testid="priority-badge"></span>
          <span class="badge" data-testid="status-badge"></span>
        </div>
        <h3 class="ticket-title" data-testid="ticket-item-title"></h3>
        <p class="ticket-customer" data-testid="ticket-item-customer"></p>
        <div class="ticket-actions">
          <select class="status-select" data-testid="status-select" aria-label="Change status">
            <option value="open">Open</option>
            <option value="in_progress">In progress</option>
            <option value="resolved">Resolved</option>
          </select>
          <button type="button" class="secondary suggest-button" data-testid="suggest-reply">Suggest reply</button>
        </div>
        <p class="suggestion" data-testid="reply-suggestion" hidden></p>
      </li>
    </template>
  </body>
</html>
